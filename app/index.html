:root{
  --bg:#F4EEE4; --surface:#FFFCF7; --surface-2:#FBF6EE; --ink:#2B2F33; --ink-2:#4A4F53; --muted:#7A7D76; --line:#E6DDCF;
  --sage:#6C7D68; --sage-deep:#55654F; --sage-soft:#E1E7DB; --on-sage:#FFFCF7; --done:#9AA596;
  --warm:#B4662E; --warm-soft:#F4E3D3; --shadow:0 1px 2px rgba(60,50,30,.06),0 6px 20px rgba(60,50,30,.07);
  --box:#B9B3A7; --hero1:#7E8F79; --hero2:#5E6E59; --hero3:#4C5A48; --dstyle:italic;
  --display:"Playfair Display",Georgia,serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --nav:68px; --ease:cubic-bezier(.2,.8,.2,1); color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1C1F22; --surface:#25292D; --surface-2:#2B3034; --ink:#EEE8DE; --ink-2:#CFC9BF; --muted:#9EA39C; --line:#363B40;
  --sage:#A9BAA3; --sage-deep:#C2D0BD; --sage-soft:#2F3A33; --on-sage:#1C1F22; --done:#6E7A6B;
  --warm:#E3A06C; --warm-soft:#43342A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
  --box:#7E7C79; --hero1:#4F5E4B; --hero2:#3A4637; --hero3:#303A2E}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none}
pre,textarea,input,.sel{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;-webkit-touch-callout:none}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:16px;height:16px}
/* ---------- layout ---------- */
.app{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:calc(14px + var(--safe-area-inset-top,env(safe-area-inset-top,0px))) max(16px,var(--safe-area-inset-right,env(safe-area-inset-right,0px))) calc(var(--nav) + 36px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))) max(16px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)))}
main{max-width:620px;margin:0 auto}
.view{display:flex;flex-direction:column;gap:20px}
.view.in-r{animation:inR .32s var(--ease)} .view.in-l{animation:inL .32s var(--ease)} .view.in{animation:fadeUp .3s var(--ease)}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:4px}
.top .eyebrow{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);font-weight:600}
.top h1{font-family:var(--display);font-style:var(--dstyle);font-weight:600;font-size:34px;line-height:1.08;margin:4px 0 0;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:13.5px;margin:4px 0 0}
.logo{width:46px;height:46px;color:var(--sage);flex:none;opacity:.95}
.logo.img{width:auto;height:auto;display:inline-flex;align-items:center}
.logo.img img{height:28px;width:auto;display:block}
.logo.img .ls{display:none}
@media (prefers-color-scheme: dark){.logo.img .lc{display:none}.logo.img .ls{display:block}}
.splash .logo.img img{height:56px}
.clibtn{border:0;background:none;padding:4px 0 4px 6px;margin:0;display:flex;align-items:center;gap:4px;color:var(--sage);flex:none;border-radius:14px}
.clibtn .chev{width:16px;height:16px;color:var(--muted)}
.clibtn:active{transform:scale(.96)}
.picker{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(14,16,18,.0);visibility:hidden;transition:background .25s,visibility .25s}
.picker.open{background:rgba(14,16,18,.42);visibility:visible}
.picker .pane{background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(20px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));transform:translateY(100%);transition:transform .32s var(--ease);max-width:620px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.picker.open .pane{transform:none}
.picker .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
.cli{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:var(--surface);border-radius:var(--r);padding:14px 16px;min-height:72px;box-shadow:var(--shadow);transition:transform .15s var(--ease)}
.cli:active{transform:scale(.985)}
.cli .lg{width:52px;height:40px;display:grid;place-items:center;flex:none}
.cli .lg .logo{width:40px;height:40px}
.cli .lg .logo.img img{height:auto;max-width:52px;max-height:22px}
.cli .t{flex:1;min-width:0;display:flex;flex-direction:column}
.cli .t b{font-weight:600}
.cli .t span{font-size:12.5px;color:var(--muted)}
.cli .ok{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sage);color:var(--on-sage);flex:none}
.cli .ok .i{width:16px;height:16px;stroke-width:3}
h2{font-family:var(--display);font-style:var(--dstyle);font-weight:500;font-size:22px;margin:0}
.label{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.section{display:flex;flex-direction:column;gap:10px}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.link{background:none;border:0;padding:6px 0;color:var(--sage);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:4px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
/* ---------- hero ---------- */
.hero{position:relative;border-radius:24px;overflow:hidden;color:#FFFCF7;box-shadow:var(--shadow);background:radial-gradient(120% 90% at 100% 0%,var(--hero1) 0%,var(--hero2) 55%,var(--hero3) 100%);padding:18px;display:flex;flex-direction:column;gap:16px}
.hero .top2{display:grid;grid-template-columns:40% 1fr;gap:16px;align-items:end}
.hero .art{border:0;padding:0;border-radius:14px;overflow:hidden;aspect-ratio:4/5;background:rgba(0,0,0,.2);box-shadow:0 10px 24px rgba(0,0,0,.25);transform:rotate(-2deg)}
.hero .art.v{aspect-ratio:9/16}
.hero .art img{width:100%;height:100%;object-fit:cover;display:block}
.hero .meta{display:flex;flex-direction:column;gap:10px;padding-bottom:4px;min-width:0}
.hero .sub2{font-size:13px;opacity:.85;display:flex;align-items:center;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:6px 10px;border-radius:999px;background:rgba(255,252,247,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hero .name{font-family:var(--display);font-style:var(--dstyle);font-size:27px;line-height:1.12}
.hero .row{display:flex;gap:8px}

<script>
(function(){

/* ---------- store: only on this phone; new seed content merged with saved ticks ---------- */
function load(){ const saved=savedOf(CLI.id);
  const base=JSON.parse(JSON.stringify(SEED)); if(!saved) return base;
  if(!base.some(r=>r.group==="cal")) return saved.concat(base.filter(b=>!saved.find(r=>r.id===b.id)));  // contenuti non ancora arrivati: ultimo stato salvato
  const byId={}; saved.forEach(r=>byId[r.id]=r);
  const out=base.map(r=>{ const s=byId[r.id]; if(!s) return r; if(r.checks) r.checks=Object.assign({},r.checks,s.checks||{}); if("done" in r) r.done=!!s.done; return r; });
  saved.filter(r=>(r.custom||r.private)&&!base.find(b=>b.id===r.id)).forEach(r=>out.push(r)); return out; }
let rows=[], tab="oggi", heroId=null, cat="car";
const sessionDone=new Set(); let oldDone=new Set();
function persist(){ try{ localStorage.setItem(KP+CLI.id,JSON.stringify(rows.map(r=>{ const o=Object.assign({},r); return o; }))); }catch(_){ toast("Il browser non sta salvando le spunte"); } }
function save(){ persist(); renderAll(); syncNotifs(); }
/* ---------- promemoria (solo app) ---------- */
let nt=null;
function notifsOf(c,rs){ const now=Date.now(), out=[], off=(c.notifIdx||0)*10000, many=REG.clienti.length>1, pre=many?c.breve+" · ":"";
  const ref=c.referente||"il cliente", col=(c.tema&&c.tema.light&&c.tema.light.sage)||"#6C7D68";
  const at=(d,h,m)=>{ const x=new Date(d); x.setHours(h,m,0,0); return x; };
  rs.filter(r=>r.group==="cal"&&r.date&&r.time).forEach(r=>{ const d=parseDate(r.date), [hh,mm]=r.time.split(":").map(Number), c2=r.checks||{}, has=k=>(r.checkOrder||[]).includes(k);
    const okK=has("ok_referente")?"ok_referente":has("ok_lucia")?"ok_lucia":null;
    const N=(id,title,body,x)=>out.push({id:off+id,title:pre+title,body,at:x.getTime(),postId:r.id,cliente:c.id,color:col});
    if(okK&&!c2[okK]){ const x=at(new Date(d.getTime()-2*864e5),10,0); if(x>now) N(r.order*10+3,ref.length<=20?"Descrizione per "+ref:"Descrizione da far approvare","Manda a "+ref+" la descrizione di «"+r.title+"» ("+GS[d.getDay()]+" "+d.getDate()+")",x); }
    if(has("programmato")&&!c2.programmato){ const x=at(new Date(d.getTime()-864e5),18,0); if(x>now) N(r.order*10+1,"Domani esce «"+r.title+"»","Programmalo su Instagram: nella scheda trovi "+(r.kind==="reel"?"video, copertina":"slide")+" e descrizione.",x); }
    if(has("storia")&&!c2.storia){ const x=at(d,hh,mm+15); if(x>now) N(r.order*10+2,"È uscito «"+r.title+"»","Condividilo in storia"+((r.checkOrder||[]).some(k=>k.startsWith("ev_")&&k!=="ev_vuota"&&!c2[k])?" e aggiungilo all'evidenza":"")+".",x); }
  });
  return out; }
function syncNotifs(){ if(!NAT||!NAT.notify) return; clearTimeout(nt); nt=setTimeout(()=>{
  const out=[]; REG.clienti.forEach(c=>out.push(...notifsOf(c,c.id===CLI.id?rows:(savedOf(c.id)||[]))));
  NAT.notify(out).catch(()=>{});
 },800); }
const cal=()=>rows.filter(r=>r.group==="cal").sort((a,b)=>a.order-b.order);
const todos=()=>rows.filter(r=>r.group==="todo").sort((a,b)=>a.order-b.order);
const stepsOf=r=>(r.checkOrder||[]).map(k=>({k,on:!!(r.checks||{})[k],label:(r.labels||{})[k]||k,hint:(r.hints||{})[k]||HINTS[k]}));
const thumbOf=r=>{ const m=MEDIA[r.folder]||{}; return (m.slides&&m.slides[0])||m.cover||""; };
let lastPop=null;
function toggle(r,k){ const was=!!r.checks[k]; r.checks[k]=!was; lastPop=r.id+":"+k; buzz(was?6:[8,40,8]); save();
  undo((was?"Tolta: ":"Fatto: ")+((r.labels||{})[k]||k),()=>{ r.checks[k]=was; save(); }); }
function setDone(r){ const v=!r.done; r.done=v; if(v) sessionDone.add(r.id); lastPop="t:"+r.id; buzz(v?[8,40,8]:6); save();
  undo((v?"Fatto: ":"Riaperto: ")+r.title,()=>{ r.done=!v; save(); }); }

/* ---------- toast ---------- */
let tt=null;
function showToast(html,ms){ const el=$("toast"); el.innerHTML=html; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),ms); }
function toast(m){ showToast('<span class="msg" style="padding:0 10px 0 0">'+esc(m)+'</span>',2300); }
function undo(m,fn){ showToast('<span class="msg">'+esc(m)+'</span><button type="button" class="undo">'+ic("undo-2","sm")+'Annulla</button>',6000);
  $("toast").querySelector(".undo").onclick=()=>{ fn(); buzz(6); $("toast").classList.remove("show"); }; }

/* ---------- copy / share / save ---------- */
async function copyText(txt,box){ try{ if(NAT) await NAT.copy(txt); else await navigator.clipboard.writeText(txt); buzz(); toast("Copiato"); }
  catch(_){ if(box){ box.innerHTML='<p class="label" style="margin:0 0 6px">Tieni premuto per copiare</p><textarea class="fallback" readonly>'+esc(txt)+'</textarea>'; const ta=box.querySelector("textarea"); ta.focus(); ta.select(); } else toast("Copia non disponibile qui"); } }
function toFile(uri,name){ const [h,b]=uri.split(","); const mime=h.match(/:(.*?);/)[1]; const bin=atob(b); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new File([a],name,{type:mime}); }
async function shareFiles(list,title){ if(NAT){ try{ await NAT.share(list,title); }catch(e){ toast("Condivisione non riuscita"); } return; } try{ const files=list.map(x=>toFile(x.uri,x.name));
    if(navigator.canShare&&navigator.canShare({files})){ await navigator.share({files,title}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  toast("Condivisione non disponibile: uso «Salva»"); saveFiles(list); }
function saveFiles(list,okMsg){ buzz(); if(NAT){ toast("Salvo nella galleria…"); const al=CLI.album||"Piano Social"; NAT.save(list,al).then(()=>toast(okMsg?okMsg:list.length>1?list.length+" file salvati in qualità piena · album «"+al+"»":"Salvato in qualità piena · album «"+al+"»")).catch(()=>toast("Salvataggio non riuscito")); return; } list.forEach((x,i)=>setTimeout(()=>{ const a=document.createElement("a"); a.href=x.uri; a.download=x.name; document.body.appendChild(a); a.click(); a.remove(); },i*350));
  toast(list.length>1?"Salvo "+list.length+" file in Download…":"Salvato in Download"); }

/* ---------- navigation, back button ---------- */
const layers=[];

function show(name,dir){ if(name===tab&&!dir) return; const from=TABS.findIndex(t=>t[0]===tab), to=TABS.findIndex(t=>t[0]===name);

/* ---------- gestures ---------- */
function swipe(el,h){ let x0,y0,t0s,lock=null,id=null;
  el.addEventListener("touchstart",e=>{ if(e.touches.length!==1){ x0=null; return; } const t=e.touches[0]; x0=t.clientX; y0=t.clientY; t0s=Date.now(); lock=null;
    id=h.ignore&&e.target.closest(h.ignore)&&!(h.edge&&x0<32)?"skip":null; },{passive:true});
  el.addEventListener("touchmove",e=>{ if(x0==null||id==="skip") return; const t=e.touches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(!lock&&(Math.abs(dx)>12||Math.abs(dy)>12)) lock=Math.abs(dx)>Math.abs(dy)*1.3?"x":"y";
    if(h.move) h.move(dx,dy,lock); },{passive:true});
  el.addEventListener("touchend",e=>{ if(x0==null||id==="skip") return; const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0, dt=Date.now()-t0s;
    const fast=dt<450; let done=false;
    if(lock==="x"&&(Math.abs(dx)>90||(fast&&Math.abs(dx)>45))){ done=true; (dx<0?h.left:h.right)&&(dx<0?h.left():h.right()); }
    else if(lock==="y"&&dy>0&&(dy>110||(fast&&dy>60))&&h.down){ done=true; h.down(); }
    if(h.end) h.end(done); x0=null; },{passive:true}); }
swipe(document.querySelector(".app"),{ignore:".gal,.seg,.hthumbs,input,textarea",
  left(){ const i=TABS.findIndex(t=>t[0]===tab); if(i<TABS.length-1){ buzz(4); show(TABS[i+1][0]); } },
  right(){ const i=TABS.findIndex(t=>t[0]===tab); if(i>0){ buzz(4); show(TABS[i-1][0]); } }});

/* ---------- shared bits ---------- */

      img.style.transformOrigin=((e.clientX-rc.left)/rc.width*100)+"% "+((e.clientY-rc.top)/rc.height*100)+"%"; img.style.transform="scale("+zoom+")"; buzz(4); } lastTap=now; }); }
function lbGo(d){ const n=lbI+d; if(n<0||n>=lbItems.length||zoom>1) return; lbI=n; buzz(4); renderLb(); const m=$("lb").querySelector(".lbm>*"); if(m){ m.animate([{opacity:0,transform:"translateX("+(d*40)+"px)"},{opacity:1,transform:"none"}],{duration:260,easing:"cubic-bezier(.2,.8,.2,1)"}); } }
swipe($("lb"),{ignore:".btns,video",left(){ lbGo(1); },right(){ lbGo(-1); },down(){ if(zoom===1) closeTop(); },
  move(dx,dy,lock){ const m=$("lb").querySelector(".lbm>*"); if(!m||zoom>1) return; m.style.transition="none"; m.style.transform=lock==="y"&&dy>0?"translateY("+dy+"px) scale("+Math.max(.8,1-dy/1200)+")":lock==="x"?"translateX("+dx*0.5+"px)":""; if(lock==="y"&&dy>0) $("lb").style.background="rgba(14,16,18,"+Math.max(.5,.96-dy/600)+")"; },
  end(done){ const m=$("lb").querySelector(".lbm>*"); if(m&&!done){ m.style.transition=""; m.style.transform=""; } $("lb").style.background=""; }});
document.addEventListener("keydown",e=>{ if(!$("lb").classList.contains("open")) { if(e.key==="Escape"&&layers.length) closeTop(); return; }
  if(e.key==="ArrowRight") lbGo(1); if(e.key==="ArrowLeft") lbGo(-1); if(e.key==="Escape") closeTop(); });

/* ---------- render ---------- */
function renderAll(){ renderOggi(); renderCal(); renderTodo(); if(tab==="ris") renderRis(); if(openId) renderPost();
  const n=todos().filter(x=>!x.done).length; const b=$("badge"); b.hidden=!n; b.textContent=n; lastPop=null; }
function applyContent(c,src){
  const fix=v=>typeof v==="string"&&v.startsWith("f:")?src(v.slice(2)):Array.isArray(v)?v.map(fix):(v&&typeof v==="object")?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,fix(x)])):v;
  MEDIA=fix(c.media||{}); RES=Object.assign(emptyRes(),fix(c.res||{}));
  const ids=new Set((c.seed||[]).map(r=>r.id)); SEED=(c.seed||[]).concat((PRIV[CLI.id]||[]).filter(r=>!ids.has(r.id)));
  rows=load(); rows.filter(r=>r.group==="todo"&&r.done&&!sessionDone.has(r.id)).forEach(r=>oldDone.add(r.id)); }
/* ---------- clienti: tema e cambio ---------- */
function applyTheme(c){ const t=c.tema; if(!t) return; const h=t.hero||{light:[],dark:[]};
  const v=o=>Object.entries(o).map(([k,x])=>"--"+k+":"+x).join(";");
  const L=Object.assign({},t.light,{hero1:h.light[0],hero2:h.light[1],hero3:h.light[2]}), D=Object.assign({},t.dark,{hero1:h.dark[0],hero2:h.dark[1],hero3:h.dark[2]});
  const fam=f=>'"'+f.family+'",'+(f.family==="Inter"?'system-ui,-apple-system,"Segoe UI",sans-serif':'Georgia,serif');
  $("tema").textContent=":root{"+v(L)+";--display:"+fam(t.display)+";--dstyle:"+(t.display.style||"normal")+";--body:"+fam(t.body)+"}"+
    "@media (prefers-color-scheme: dark){:root{"+v(D)+"}}";
  $("tc-l").setAttribute("content",L.bg); $("tc-d").setAttribute("content",D.bg); document.title="Piano "+c.breve; }
async function setClient(id){
  CLI=REG.clienti.find(c=>c.id===id)||REG.clienti[0]; try{ localStorage.setItem(KCLI,CLI.id); }catch(_){}
  applyTheme(CLI); SEED=[]; MEDIA={}; RES=emptyRes(); heroId=null; cat="car"; sessionDone.clear(); oldDone=new Set();
  const pack=PACK[CLI.id], me=CLI; let c=null;
  if(NAT&&NAT.content){ try{ if(pack&&NAT.content.seed) await NAT.content.seed(CLI,pack); c=await Promise.race([NAT.content.cached(CLI),wait(2500)]); }catch(_){} }
  if(me!==CLI) return;
  if(c) applyContent(c.data,c.src); else if(pack) applyContent(pack,p=>p); else { SEED=(PRIV[CLI.id]||[]).slice(); rows=load(); }
  oldDone=new Set(rows.filter(r=>r.group==="todo"&&r.done).map(r=>r.id)); }
function openPicker(){ const p=$("picker"); if(p.classList.contains("open")) return; buzz(4);
  p.innerHTML='<div class="pane" role="dialog" aria-label="Scegli il cliente"><div class="grab"></div><p class="label" style="padding:0 4px">Cliente</p></div>';
  const pane=p.firstChild;
  REG.clienti.forEach(c=>{ const rs=c.id===CLI.id?rows:(savedOf(c.id)||[]), cr=rs.filter(r=>r.group==="cal"); let open=0;
    cr.forEach(r=>(r.checkOrder||[]).forEach(k=>{ if(!(r.checks||{})[k]) open++; })); const td=rs.filter(r=>r.group==="todo"&&!r.done).length;
    const b=document.createElement("button"); b.type="button"; b.className="cli"; b.setAttribute("aria-current",c.id===CLI.id?"true":"false");
    b.innerHTML='<span class="lg" style="color:'+((c.tema&&c.tema.light.sage)||"inherit")+'">'+logoOf(c)+'</span><span class="t"><b>'+esc(c.nome)+'</b><span>'+
      (!rs.length?"Tocca per aprire":cr.length?(open?open+(open===1?" passaggio":" passaggi")+" da fare":"Passaggi tutti fatti")+(td?" · "+td+" in sospeso":""):"Calendario non ancora pronto")+'</span></span>'+(c.id===CLI.id?'<span class="ok">'+ic("check")+'</span>':'');
    b.onclick=async()=>{ closeTop(); if(c.id===CLI.id) return; buzz([8,40,8]); await setClient(c.id); show("oggi",true); renderAll(); syncNotifs(); syncContent(false); };
    pane.appendChild(b); });
  if(NAT&&NAT.tokenKey&&REG.clienti.some(c=>c.privato)){ let has=false; try{ has=!!localStorage.getItem(NAT.tokenKey); }catch(_){}
    const f=document.createElement("form"); f.className="card txt"; f.style.marginTop="6px";
    f.innerHTML='<p class="label">Contenuti non pubblici</p><p class="sub" style="margin:0;color:var(--muted);font-size:13px">'+(has?'Collegati: i clienti in attesa di approvazione si aggiornano da soli.':'Incolla qui il token di sola lettura del repository privato: resta solo su questo telefono.')+'</p>'+
      '<div class="add"><input type="password" autocomplete="off" placeholder="'+(has?'Token salvato · incollane uno nuovo per cambiarlo':'github_pat_…')+'"><button class="btn icon" type="submit" aria-label="Salva token">'+ic("check")+'</button></div>';
    f.onsubmit=async e=>{ e.preventDefault(); const v=f.querySelector("input").value.trim(); if(!v) return; let old=null; try{ old=localStorage.getItem(NAT.tokenKey); localStorage.setItem(NAT.tokenKey,v); }catch(_){}
      toast("Controllo il token…"); const c=REG.clienti.find(x=>x.privato); let res=c&&NAT.checkPrivate?await NAT.checkPrivate(c):{ok:true}; if(typeof res==="boolean") res={ok:res};
      if(res.ok){ buzz([8,40,8]); toast("Collegato"); closeTop(); lastSync[CLI.id]=0; syncContent(true); }
      else{ try{ if(old) localStorage.setItem(NAT.tokenKey,old); else localStorage.removeItem(NAT.tokenKey); }catch(_){} showToast('<span class="msg">'+(res.motivo==="rete"?"Non riesco a collegarmi: "+esc(res.dettaglio||"rete"):"Token non valido o senza accesso al repository")+'</span>',6000); } };
    pane.appendChild(f); }
  p.classList.add("open"); p.setAttribute("aria-hidden","false");
  pushLayer("picker",()=>{ p.classList.remove("open"); p.setAttribute("aria-hidden","true"); });
  p.onclick=e=>{ if(e.target===p) closeTop(); }; }
document.addEventListener("click",e=>{ if(e.target.closest&&e.target.closest(".clibtn")){ e.stopPropagation(); openPicker(); } });
async function boot(){
  try{ PACK=J("d-pack")||{}; }catch(_){}
  let id=null; try{ id=localStorage.getItem(KCLI); }catch(_){}
  CLI=REG.clienti.find(c=>c.id===id)||REG.clienti[0]; applyTheme(CLI); $("splash").innerHTML=logo();
  if(NAT&&NAT.registry){ try{ const r=await Promise.race([NAT.registry.cached(),wait(1500)]); if(r&&r.clienti&&r.clienti.length) REG=r; }catch(_){} }
  REG.clienti.forEach(migrate);
  await setClient(id);
  renderAll(); $("v-oggi").classList.add("in");
  try{ const up=localStorage.getItem("piano_app_updated"); if(up){ localStorage.removeItem("piano_app_updated"); setTimeout(()=>showToast('<span class="msg">'+ic("sparkles","sm")+' App aggiornata con le novità</span>',4000),900); } }catch(_){} setTimeout(()=>$("splash").classList.add("gone"),250);
  if(NAT){ NAT.hideSplash(); syncNotifs();
    if(NAT.onNotifTap) NAT.onNotifTap(async(id,cli)=>{ if(cli&&cli!==CLI.id){ await setClient(cli); renderAll(); } if(rows.find(r=>r.id===id)){ while(layers.length) popLayer(); show("cal"); openPost(id); } });
    NAT.onBack(()=>{ if(layers.length) closeTop(); else if(tab!=="oggi") show("oggi"); else NAT.exit(); });
    if(NAT.content){ syncContent(false); if(NAT.onResume) NAT.onResume(()=>syncContent(false)); setupPull(); } } }
/* ---------- sincronizzazione contenuti ---------- */
let syncing=false; const lastSync={};
function syncBar(html){ const b=$("syncbar"); if(html==null){ b.classList.remove("show"); return; } b.innerHTML=html; b.classList.add("show"); }
async function syncContent(manual){
  if(!NAT||!NAT.content||syncing) return; const me=CLI; if(!manual&&Date.now()-(lastSync[me.id]||0)<60000) return;
  syncing=true; lastSync[me.id]=Date.now(); if(manual) syncBar('<span class="spin"></span>Controllo aggiornamenti…');
  try{
    if(NAT.registry){ const nr=await NAT.registry.update().catch(()=>null);
      if(nr&&nr.clienti&&nr.clienti.length){ REG=nr; REG.clienti.forEach(migrate); const cur=REG.clienti.find(c=>c.id===CLI.id); if(cur){ CLI=cur; applyTheme(CLI); renderAll(); } } }
    const cli=REG.clienti.find(c=>c.id===me.id)||me;
    const c=await NAT.content.update(cli,(n,tot)=>{ if(tot>0&&CLI.id===cli.id) syncBar('<span class="spin"></span>Aggiorno '+esc(cli.breve)+'… '+n+' di '+tot); });
    syncBar(null);
    if(c&&c.changed&&CLI.id===cli.id){ applyContent(c.data,c.src); renderAll(); syncNotifs(); buzz([8,40,8]); showToast('<span class="msg">'+ic("check","sm")+' Contenuti aggiornati</span>',4000); }
    else if(manual) showToast('<span class="msg">Già tutto aggiornato</span>',2500);
    if(NAT.appUpdate){ const v=await NAT.appUpdate(); if(v){ try{ localStorage.setItem("piano_app_updated",String(v)); }catch(_){} } }
  }catch(e){ syncBar(null); if(e&&e.message==="token") showToast('<span class="msg">Token del repository privato non valido: tocca il logo per cambiarlo</span>',5000); else if(manual) showToast('<span class="msg">Nessuna connessione: resta l\'ultima versione</span>',3500); }
  syncing=false; }
function setupPull(){ const sc=$("scroller"), ind=$("pull"); let y0=null, dy=0;
  sc.addEventListener("touchstart",e=>{ y0=(sc.scrollTop<=0&&e.touches.length===1)?e.touches[0].clientY:null; dy=0; },{passive:true});
  sc.addEventListener("touchmove",e=>{ if(y0==null) return; dy=e.touches[0].clientY-y0; if(dy<=0){ ind.style.transform=""; ind.classList.remove("ready"); return; }
    const d=Math.min(dy*0.5,90); ind.style.transform="translate(-50%,"+(d)+"px) rotate("+(d*3)+"deg)"; ind.style.opacity=Math.min(1,d/50); ind.classList.toggle("ready",d>=70); },{passive:true});
  sc.addEventListener("touchend",()=>{ if(y0==null) return; const go=ind.classList.contains("ready"); ind.classList.remove("ready"); ind.style.transform=""; ind.style.opacity=0; y0=null; if(go){ buzz(10); syncContent(true); } },{passive:true}); }
window.__boot=boot;
})();
</script>
